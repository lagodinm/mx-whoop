# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate && open MXWhoop.xcodeproj
name: MXWhoop
options:
  bundleIdPrefix: com.mx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple ID team here, or pick it in Xcode › Signing & Capabilities.
    DEVELOPMENT_TEAM: ""

packages:
  WhoopKit:
    path: Packages/WhoopKit

targets:
  MXWhoop:
    type: application
    platform: iOS
    sources:
      - path: MXWhoop
        excludes:
          - "Info.plist"
    dependencies:
      - package: WhoopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mx.whoop
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: MXWhoop/Info.plist
      properties:
        CFBundleDisplayName: MX Whoop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: MX Whoop connects to your WHOOP strap over Bluetooth to stream heart rate, beat-to-beat intervals and motion data.
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

schemes:
  MXWhoop:
    build:
      targets:
        MXWhoop: all
    run:
      config: Debug
    archive:
      config: Release
